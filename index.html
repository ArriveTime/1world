<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080f20">
<meta name="description" content="NEXUS is an independent digital discovery and community platform prototype. Search, watch, discover and connect in one place.">
<title>NEXUS | Discover. Watch. Connect.</title>
<style>
:root{--bg:#080f20;--panel:#14243b;--line:#30445e;--cyan:#6be6f0;--gold:#f2c982;--muted:#b7c8da}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#fff;font:16px/1.6 Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
button{cursor:pointer}
header{background:#091427;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
nav{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:900;letter-spacing:2px;color:var(--cyan)}
nav .links{display:flex;gap:17px;flex-wrap:wrap;font-size:13px;font-weight:bold}
nav a:hover{color:var(--cyan)}
.hero{min-height:480px;background:linear-gradient(100deg,#071326ed,#0b1e39aa),url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1800&q=85') center/cover;display:grid;place-items:center;text-align:center;padding:65px 18px}
.hero-inner{max-width:900px}
.eyebrow{color:var(--cyan);letter-spacing:3px;font-size:12px;font-weight:bold}
h1{font-size:clamp(45px,7vw,82px);line-height:1.1;margin:15px 0}
h1 span{color:var(--cyan)}
.hero p{color:#e3ecf8;font-size:18px;max-width:730px;margin:0 auto 26px}
.searchbox{display:flex;gap:10px;max-width:740px;margin:auto;background:#152b48;padding:12px;border-radius:13px;border:1px solid #64809d}
.searchbox input{flex:1;min-width:0;border:0;border-radius:7px;padding:16px;background:white;color:#111;font-size:17px}
.btn,.searchbox button{background:#3486ee;color:white;border:0;border-radius:8px;padding:13px 20px;font-weight:bold}
.btn:hover,.searchbox button:hover{background:#60a5fa}
.wrap{max-width:1200px;margin:auto;padding:65px 20px}
.heading{text-align:center;margin-bottom:32px}
.heading small{color:var(--cyan);letter-spacing:2px;font-weight:bold}
.heading h2{font-size:clamp(29px,4vw,43px);margin:8px 0}
.heading p,.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card img{width:100%;height:210px;object-fit:cover;display:block}
.card-body{padding:20px}
.card h3{margin:0 0 8px;font-size:23px}
.card p{color:var(--muted);font-size:14px}
.card a{display:inline-block;background:#27599c;padding:10px 15px;border-radius:7px;font-size:13px;font-weight:bold}
.card a:hover{background:#3486ee}
.alt{background:#0e1b30}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.tool{background:#182c47;border:1px solid var(--line);padding:23px;border-radius:12px;text-align:center}
.tool .symbol{font-size:32px}
.tool h3{margin:10px 0 5px}
.tool p{color:var(--muted);font-size:14px}
.section-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.section-actions button{background:#203b5c;color:white;border:1px solid #527294;padding:10px 17px;border-radius:8px}
.section-actions button.active{background:#3486ee}
.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.video{background:#14243b;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.video video{display:block;width:100%;height:205px;background:black;object-fit:contain}
.video-body{padding:17px}
.video h3{font-size:18px;margin:0 0 7px;overflow-wrap:anywhere}
.video p{font-size:13px;color:var(--muted);margin:0}
.community-layout{display:grid;grid-template-columns:1fr 1.5fr;gap:20px;align-items:start}
.panel{padding:22px}
.panel h3{margin:0 0 15px}
.field{display:block;width:100%;padding:13px;margin:10px 0;border-radius:8px;border:1px solid #708099;background:white;color:#111}
textarea.field{min-height:110px;resize:vertical}
.post{background:#1a2e49;border:1px solid #405575;padding:18px;border-radius:12px;margin-bottom:14px;overflow-wrap:anywhere}
.post h4{margin:0 0 7px;color:var(--cyan)}
.post p{white-space:pre-wrap;margin:8px 0 13px}
.post button{background:#294d79;border:0;color:white;padding:8px 12px;border-radius:7px;margin-right:8px}
.comments{margin-top:12px;border-top:1px solid #405575;padding-top:10px}
.comment{font-size:13px;color:#dce8f6;padding:7px 0;border-bottom:1px solid #344862}
.results{max-width:900px;margin:25px auto 0;text-align:left}
.result{background:#1b304d;padding:16px;margin:10px 0;border-radius:10px;border:1px solid #405b7c}
.result strong{color:var(--cyan)}
.result p{margin:5px 0;color:#d2deed;font-size:14px}
.result a{color:var(--gold);text-decoration:underline}
.hidden{display:none!important}
.notice{background:#192c45;border-left:3px solid var(--gold);padding:14px;border-radius:5px;color:#d7e2ef;font-size:13px;margin:15px 0}
.legal{background:#060c18;border-top:1px solid var(--line);padding:35px 20px;color:#b5c5d7;font-size:13px}
.legal-inner{max-width:1100px;margin:auto}
.legal h3{color:var(--gold)}
footer{text-align:center;background:#040913;padding:25px;color:var(--muted);font-size:13px}
